<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flores amarillas</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbde9e}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .stage{
    position:fixed;inset:0;
    display:grid;place-items:center;
    overflow:hidden;
    background:#fbde9e;
  }

  .bouquet-svg{
    width:min(88vw,88vh);
    height:auto;
    display:block;
    overflow:visible;
    shape-rendering:geometricPrecision;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
  }

  .bouquet-svg path,
  .bouquet-svg rect,
  .bouquet-svg circle{
    shape-rendering:geometricPrecision;
  }

  .hint{
    position:fixed;left:50%;bottom:24px;z-index:4;
    transform:translateX(-50%);
    margin:0;
    color:rgba(75,53,38,.58);
    font-size:12px;
    font-weight:400;
    line-height:1.35;
    letter-spacing:.01em;
    white-space:nowrap;
    pointer-events:none;
    transition:opacity .28s ease,transform .28s ease;
  }
  .hint.hide{opacity:0;transform:translateX(-50%) translateY(4px)}

  .shade{
    position:fixed;inset:0;z-index:6;
    background:rgba(0,0,0,.60);
    opacity:0;pointer-events:none;
    transition:opacity .36s ease;
  }
  .shade.show{opacity:1;pointer-events:auto}

  .message-layer{
    position:fixed;inset:0;z-index:7;
    display:grid;place-items:center;
    padding:24px;
    opacity:0;pointer-events:none;
    transition:opacity .36s ease;
  }
  .message-layer.show{opacity:1;pointer-events:auto}

  .message{
    width:min(88vw,520px);
    text-align:center;
    color:#fff;
    transform:translateY(6px);
    transition:transform .42s cubic-bezier(.2,.7,.2,1);
  }
  .message-layer.show .message{transform:translateY(0)}

  .date{
    margin:0 0 12px;
    color:rgba(255,255,255,.58);
    font-size:12px;
    font-weight:400;
    line-height:1.4;
  }

  h1{
    max-width:18ch;
    margin:0 auto;
    color:#fff;
    font-size:clamp(30px,4.3vw,46px);
    font-weight:600;
    line-height:1.08;
    letter-spacing:-.025em;
    text-wrap:balance;
  }

  .copy{
    max-width:42ch;
    margin:15px auto 0;
    color:rgba(255,255,255,.76);
    font-size:clamp(14px,1.55vw,16px);
    font-weight:400;
    line-height:1.55;
  }

  .close{
    appearance:none;border:0;background:transparent;
    margin:19px 0 0;padding:8px 10px;
    color:rgba(255,255,255,.64);
    font:inherit;font-size:13px;font-weight:500;
    cursor:pointer;
  }
  .close:hover{color:#fff}

  @media(max-width:600px){
    .bouquet-svg{width:min(96vw,87vh)}
    .hint{bottom:18px;font-size:11px}
    h1{max-width:15ch;font-size:clamp(30px,9vw,39px)}
    .copy{max-width:34ch;font-size:14px}
  }

  @media(prefers-reduced-motion:reduce){
    .hint,.shade,.message-layer,.message{transition:none!important}
  }
</style>
</head>

    <p class="date">21 de septiembre</p>
    <h1>Estas flores son para ti.</h1>
    <p class="copy">No quería mandarte solo una imagen. Quería hacerte algo un poquito más especial.</p>
    <button class="close" id="close" type="button">Cerrar</button>
  </div>

<script>
(() => {
  const svg = document.getElementById('Capa_2');
  const object = document.getElementById('Objeto_generativo');
  const hint = document.getElementById('hint');
  const shade = document.getElementById('shade');
  const messageLayer = document.getElementById('messageLayer');
  const closeBtn = document.getElementById('close');

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  const objectChildren = Array.from(object.children);
  const artwork = objectChildren.find(el => el.tagName.toLowerCase() === 'g');
  const parts = Array.from(artwork.children);

  // Verified against bubu.svg structure.
  const flowerRight = parts[14];
  const flowerLeft  = parts[15];
  const endGroup    = parts[16];

  const paper = endGroup.children[0];
  const character = endGroup.children[1];

  // Leaf groups + large individual leaves around the bouquet.
  const leafGroups = [
    parts[5], parts[6],
    parts[7], parts[8], parts[9], parts[10], parts[11]
  ].filter(Boolean);

  function center(el) {
    const b = el.getBBox();
    return {x:b.x+b.width/2, y:b.y+b.height/2};
  }

  const centers = new Map();
  [flowerRight, flowerLeft, paper, character, ...leafGroups].forEach(el => {
    centers.set(el, center(el));
  });

  function setAround(el, tx, ty, rot, scale=1) {
    if(!el) return;
    const c = centers.get(el) || center(el);
    el.setAttribute(
      'transform',
      `translate(${tx.toFixed(3)} ${ty.toFixed(3)}) ` +
      `translate(${c.x.toFixed(3)} ${c.y.toFixed(3)}) ` +
      `rotate(${rot.toFixed(4)}) ` +
      `scale(${scale.toFixed(5)}) ` +
      `translate(${(-c.x).toFixed(3)} ${(-c.y).toFixed(3)})`
    );
  }

  function rgb(fill) {
    const m = fill && fill.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    return m ? [Number(m[1]),Number(m[2]),Number(m[3])] : null;
  }

  function isPetal(el) {
    if(el.tagName.toLowerCase() !== 'path') return false;
    const c = rgb(getComputedStyle(el).fill);
    if(!c) return false;
    return c[0] > 220 && c[1] > 125 && c[1] < 215 && c[2] < 105;
  }

  function collectPetals(group, flowerCenter, sideBias) {
    return Array.from(group.querySelectorAll('path'))
      .filter(isPetal)
      .map((el,i) => {
        const b = el.getBBox();
        const ex = b.x+b.width/2;
        const ey = b.y+b.height/2;

        // Pivot pulled toward the flower center = bends from its base.
        const px = ex + (flowerCenter.x-ex)*0.62;
        const py = ey + (flowerCenter.y-ey)*0.62;

        return {
          el, px, py,
          phase: i*0.73 + sideBias,
          speed: 0.70 + (i%6)*0.055,
          amp: 0.80 + (i%5)*0.16
        };
      });
  }

  const rightC = centers.get(flowerRight);
  const leftC = centers.get(flowerLeft);

  const petalsRight = collectPetals(flowerRight,rightC,0.2);
  const petalsLeft  = collectPetals(flowerLeft,leftC,1.1);

  // Área visual de ayuda para escritorio. En móvil NO dependemos de ella.
  const hit = document.createElementNS('http://www.w3.org/2000/svg','circle');
  hit.setAttribute('cx','760');
  hit.setAttribute('cy','455');
  hit.setAttribute('r','175');
  hit.setAttribute('fill','#000000');
  hit.setAttribute('fill-opacity','0.001');
  hit.setAttribute('pointer-events','all');
  hit.style.cursor='pointer';
  svg.appendChild(hit);

  /*
    Convierte coordenadas de pantalla a coordenadas internas del SVG.
    Esto hace que el toque funcione aunque el SVG cambie de tamaño
    en iPhone/Android.
  */
  function screenToSvg(clientX, clientY) {
    const point = svg.createSVGPoint();
    point.x = clientX;
    point.y = clientY;

    const matrix = svg.getScreenCTM();
    if (!matrix) return null;

    return point.matrixTransform(matrix.inverse());
  }

  function isInsideSunflower(clientX, clientY) {
    const p = screenToSvg(clientX, clientY);
    if (!p) return false;

    const dx = p.x - 760;
    const dy = p.y - 455;

    // Área táctil un poco mayor que la flor para que sea cómoda en celular.
    return (dx * dx + dy * dy) <= (185 * 185);
  }

  let lastActivation = 0;

  function tryOpenAt(clientX, clientY, event) {
    if (opened) return;
    if (!isInsideSunflower(clientX, clientY)) return;

    const now = performance.now();

    // Evita que touchend + click abran dos veces.
    if (now - lastActivation < 450) return;
    lastActivation = now;

    if (event) event.preventDefault();
    openSurprise();
  }

  let opened = false;
  let mouseX = 0, mouseY = 0;
  let smoothX = 0, smoothY = 0;

  addEventListener('pointermove', e => {
    if(opened || reduceMotion.matches) return;
    mouseX = (e.clientX/innerWidth-.5)*2.4;
    mouseY = (e.clientY/innerHeight-.5)*1.4;
  });

  addEventListener('pointerleave', () => {
    mouseX = 0; mouseY = 0;
  });

  function openSurprise() {
    if(opened) return;
    opened = true;
    mouseX = mouseY = 0;
    hint.classList.add('hide');
    shade.classList.add('show');
    setTimeout(() => messageLayer.classList.add('show'), reduceMotion.matches ? 0 : 100);
  }

  function closeSurprise() {
    messageLayer.classList.remove('show');
    shade.classList.remove('show');
    opened = false;
    setTimeout(() => hint.classList.remove('hide'), reduceMotion.matches ? 0 : 220);
  }

  // Mouse / stylus / navegadores modernos.
  svg.addEventListener('pointerup', e => {
    tryOpenAt(e.clientX, e.clientY, e);
  });

  // Fallback específico para Safari/iOS y otros navegadores táctiles.
  svg.addEventListener('touchend', e => {
    const touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    tryOpenAt(touch.clientX, touch.clientY, e);
  }, { passive:false });

  // Fallback final para taps sintetizados como click.
  svg.addEventListener('click', e => {
    tryOpenAt(e.clientX, e.clientY, e);
  });

  shade.addEventListener('click', closeSurprise);
  closeBtn.addEventListener('click', closeSurprise);

  const start = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);

    if(reduceMotion.matches) return;

    const t = (now-start)/1000;

    // Non-periodic-looking light breeze: layered frequencies.
    const wind =
      Math.sin(t*0.72)*0.52 +
      Math.sin(t*1.11+1.3)*0.30 +
      Math.sin(t*0.37+2.1)*0.18;

    const wind2 =
      Math.sin(t*0.61+0.8)*0.58 +
      Math.sin(t*0.97+2.4)*0.28 +
      Math.sin(t*0.29+0.2)*0.14;

    // Head sway is visible now, but still restrained.
    setAround(
      flowerRight,
      wind*1.15,
      Math.sin(t*0.84)*0.95,
      wind*0.55
    );

    setAround(
      flowerLeft,
      -wind2*0.95,
      Math.sin(t*0.76+1.4)*0.82,
      -wind2*0.48
    );

    // Petals flex independently ~0.8–1.6°.
    petalsRight.forEach((p,i) => {
      const gust = Math.sin(t*p.speed+p.phase)*p.amp + wind*0.30;
      p.el.setAttribute(
        'transform',
        `rotate(${gust.toFixed(4)} ${p.px.toFixed(3)} ${p.py.toFixed(3)})`
      );
    });

    petalsLeft.forEach((p,i) => {
      const gust = Math.sin(t*(p.speed*0.94)+p.phase)*p.amp + wind2*0.27;
      p.el.setAttribute(
        'transform',
        `rotate(${gust.toFixed(4)} ${p.px.toFixed(3)} ${p.py.toFixed(3)})`
      );
    });

    // Leaves react more loosely than petals.
    leafGroups.forEach((leaf,i) => {
      const local =
        Math.sin(t*(0.54+i*0.025)+i*0.8)*0.38 +
        wind*(0.20+(i%3)*0.05);
      setAround(
        leaf,
        local*0.55,
        Math.sin(t*0.63+i)*0.42,
        local
      );
    });

    // Character: slight hand/body correction as if holding weight.
    const bodyX =
      Math.sin(t*0.78+0.4)*1.25 +
      Math.sin(t*1.29+2.2)*0.45;

    const bodyY =
      Math.sin(t*0.92)*2.35 +
      Math.sin(t*0.41+1.6)*0.72;

    const bodyRot =
      Math.sin(t*0.68+0.7)*0.30 +
      Math.sin(t*1.13)*0.08;

    setAround(character,bodyX,bodyY,bodyRot);

    // Paper follows the person, but with inertia.
    setAround(
      paper,
      bodyX*0.22 + wind*0.18,
      bodyY*0.17,
      -bodyRot*0.22 + wind*0.08
    );

    // Tiny whole-scene parallax only.
    smoothX += (mouseX-smoothX)*0.035;
    smoothY += (mouseY-smoothY)*0.035;
    artwork.setAttribute('transform',`translate(${smoothX.toFixed(3)} ${smoothY.toFixed(3)})`);
  }

  requestAnimationFrame(frame);
})();
</script>
